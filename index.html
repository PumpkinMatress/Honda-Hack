<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bridge — show what you built</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <!-- Shared styles (Person A), then each person's own styles. -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="profile.css"> <!-- Person A: profile page -->
  <link rel="stylesheet" href="folder.css">  <!-- Person A: note card + leaflet -->
  <link rel="stylesheet" href="teams.css">   <!-- Person B -->
  <link rel="stylesheet" href="challenge.css"> <!-- Person B: challenges board -->
  <link rel="stylesheet" href="messages.css">  <!-- Person B: messages -->
  <link rel="stylesheet" href="review.css">  <!-- Person C -->
  <link rel="stylesheet" href="credential.css"> <!-- shareable certificates -->
</head>
<body>

  <!-- Top bar on every page: logo, menu (filled in by core.js), search (search.js), "Viewing as", reset. -->
  <header class="topbar">
    <div class="topbar-inner">
      <span class="tape tape-left" aria-hidden="true"></span>
      <span class="tape tape-right" aria-hidden="true"></span>
      <a class="logo" href="#/profile" aria-label="Home">
        <span class="logo-n" aria-hidden="true">N</span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="topbar-right">
        <div class="search">
          <input id="search-input" type="search" placeholder="Search" autocomplete="off"
                 aria-label="Search people, projects and challenges" aria-controls="search-results">
          <div class="search-results" id="search-results" role="listbox" hidden></div>
        </div>
        <!-- Demo only: switch whose screen you're seeing. -->
        <select id="viewer-select" class="viewer-select" aria-label="Viewing as" title="Viewing as: switch whose screen you see"></select>
        <button class="reset-btn" id="reset-demo" title="Clear all saved changes and start the demo over">Reset</button>
      </div>
    </div>
  </header>

  <!--
    One empty box per screen. Only one is visible at a time.
    Each screen's JavaScript file draws itself into its box.
    B and C: you never need to edit this file. See README.md.
  -->
  <main class="main">
    <section class="screen" id="screen-profile"    hidden></section> <!-- profile.js   (Person A) -->
    <section class="screen" id="screen-challenges" hidden></section> <!-- challenge.js (Person B) -->
    <section class="screen" id="screen-listings"   hidden></section> <!-- listings.js  (Person B) -->
    <section class="screen" id="screen-messages"   hidden></section> <!-- messages.js  (Person B) -->
    <section class="screen" id="screen-project"    hidden></section> <!-- project.js   (Person C) -->
    <section class="screen" id="screen-review"     hidden></section> <!-- review.js    (Person C) -->
    <section class="screen" id="screen-verify"     hidden></section> <!-- credential.js: public certificate page -->
    <section class="screen" id="screen-folder"     hidden></section> <!-- folder.js: note card + leaflet (opens from a profile folder) -->
  </main>

  <!-- Order matters: data first, then core, then the screens. -->
  <script src="data.js"></script>
  <script src="core.js"></script>
  <script src="search.js"></script>    <!-- Person A: top bar search -->
  <script src="profile.js"></script>   <!-- Person A -->
  <script src="challenge.js"></script> <!-- Person B -->
  <script src="listings.js"></script>  <!-- Person B -->
  <script src="messages.js"></script>  <!-- Person B -->
  <script src="project.js"></script>   <!-- Person C -->
  <script src="review.js"></script>    <!-- Person C -->
  <script src="credential.js"></script> <!-- signed, shareable certificates -->
  <script src="folder.js"></script>    <!-- Person A: note card + leaflet -->
  <script>startApp();</script>
</body>
</html>
